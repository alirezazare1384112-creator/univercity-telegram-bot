name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations (alembic)
        run: |
          alembic upgrade head
          alembic check

      - name: Tests (pytest)
        env:
          PYTHONPATH: .
        run: python -m pytest

      - name: Environment check
        env:
          PYTHONPATH: .
        run: python run.py --check
