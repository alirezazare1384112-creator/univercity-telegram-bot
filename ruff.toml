# Lint configuration for student_assistant_bot.
# Run:  python -m ruff check .
line-length = 100
target-version = "py313"
extend-exclude = [
    # Alembic migration files are auto-generated.
    "app/database/migrations/versions",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/variables)
    "I",    # import sorting
    "UP",   # modern Python syntax
    "B",    # bugbear (bug-prone patterns)
    "SIM",  # simplifications
    "BLE",  # blind except - guarded by explicit noqa: BLE001
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by line-length; Persian text is wide
    # Persian UI text and comments: emoji/heavy symbols and RTL letters
    # are false positives for the confusables check.
    "RUF001",
    "RUF002",
    "RUF003",
]
